services:
  mongo:
    # Keep the existing data format until the deployed Mongo version is known.
    image: mongo:bionic
    networks:
      - wikimesh_network
    container_name: "wikimesh_mongo_docker"
    env_file:
     - ./mongo/.env
    volumes:
      - "./mongo/volume:/data/db"
      - "./mongo/dumps:/dumps"
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - "./mongo/.dbshell:/home/mongodb/.dbshell"
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.8.1-alpine
    networks:
      - wikimesh_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: wikimesh-flask
    container_name: "wikimesh_app"
    networks:
      - wikimesh_network
    build:
      context: "./backend"
    env_file:
      - ./mongo/.env
      - ./backend/.env
    volumes:
      - "./backend:/app/backend/"
      - "./logs:/app/logs/"
      - "./frontend/dist:/app/backend/templates:ro"
      - "./frontend/dist/static:/app/backend/static:ro"
    command: "python -m backend"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/wikimesh/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  wikimesh_network:
    driver: bridge
