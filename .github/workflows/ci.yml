name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - run: pip install -r backend/requirements.lock
      - run: pip check
      - run: python -m unittest discover backend/tests
      - run: docker build -t wikimesh-backend:test backend
      - run: docker pull redis:8.8.1-alpine
      - run: docker pull nginx:1.30.4

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker build -t wikimesh-frontend:test .
      - run: sh -n ../run.sh
      - run: docker compose -f ../frontend.yml -f ../build-front-end.yml config
