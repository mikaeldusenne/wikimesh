name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover backend/tests
