name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - run: pip install -r backend/requirements.lock
      - run: pip check
      - run: python -m unittest discover backend/tests
      - run: docker build -t wikimesh-backend:test backend
      - run: docker pull redis:8.8.1-alpine
      - run: docker pull nginx:1.30.4
